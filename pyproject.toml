tool.uv.package = true

[build-system]
requires = ["uv_build>=0.12"]
build-backend="uv_build"

[project]
name = "events"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
catplot = "events.catplot.main:main"
